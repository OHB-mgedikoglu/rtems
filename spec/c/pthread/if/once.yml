- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_once_t:/name} *${.:/params[0]/name}
    - void ( *${.:/params[1]/name} )( void )
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- role: constraint
  uid: ../constraint/once-cancel
- role: constraint
  uid: ../constraint/once-initialized
- role: constraint
  uid: ../constraint/once-no-exit
- role: constraint
  uid: ../constraint/once-no-jump
- role: constraint
  uid: ../constraint/once-no-recursion
- description: |
    The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The ${.:/params[1]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- role: reference
  uid: /ref/std/posix-2024/pthread-once
name: pthread_once
notes: |
  See ${/ref/std/posix-2024/pthread-once:/name}.

  The system delays a ${../glossary/thread-cancel-request:/term}, a
  ${/rtems/task/if/restart:/name} or a ${/rtems/task/if/delete:/name} for a
  ${../glossary/thread:/term} which executes the initialization routine or waits
  for it, until its ${.:/name} call returns. A ${/rtems/task/if/delete:/name}
  does not return before that. Together with the constraint that the
  initialization routine shall not end its thread, the deleting task then waits
  forever as well.

  The ${../glossary/thread:/term} which executes ${.:/params[1]/name} does not
  get ${/glossary/priorityinheritance:/term} from a waiting caller. A waiting
  caller can therefore suffer an unbounded ${/glossary/priorityinversion:/term}.
  The standard does not state this.
params:
- description: |
    is the once-control object used to ensure the initialization routine is called
    only once.
  dir: inout
  name: once_control
- description: |
    is the pointer to the initialization routine.
  dir: null
  name: init_routine
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The ${.:/params[0]/name} parameter was ${/c/if/null:/name}.
    value: ${/c/errno/if/einval:/name}
  - description: |
      The ${.:/params[1]/name} parameter was ${/c/if/null:/name}.
    value: ${/c/errno/if/einval:/name}
type: interface
