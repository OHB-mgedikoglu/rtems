links:
- role: requirement-refinement
  uid: /req/usage-constraints
rationale: |
  ${/ref/std/posix-2024/pthread-equal:/name} leaves the behaviour undefined if a
  parameter is not a valid thread identifier and is not equal to `PTHREAD_NULL`.
  RTEMS and Newlib do not define `PTHREAD_NULL`. The lifetime of a thread
  identifier ends when the terminated thread is joined or detached, so the
  identifier of a terminated thread which waits for its join is still valid.
text: |
  Each thread identifier parameter shall be a valid thread identifier.
type: constraint
