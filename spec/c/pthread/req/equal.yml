  description: null
  member: |
    pthread_t t2
- brief: |
    This member contains the identifier of the thread other than the thread
    identified by the ${../if/equal:/params[0]/name} parameter.
  description: null
  member: |
    pthread_t other
- brief: |
    This member contains the return value of the ${../if/equal:/name} call.
  description: null
  member: |
    int status
- brief: |
    This member contains the identifier of the worker task.
  description: null
  member: |
    rtems_id worker_id
test-context-support: null
test-description: null
test-header: null
